<!DOCTYPE html>
<html>
<head>
<title>My first flask project!</title>
</head>
<body>
	{% if podatki['uspeh'] %}
	<i>Uspešno sem se povezal na database</i>
	{%else%}
	<i>nisem se povezal</i>
	{%endif%}

	<form action="/" method="post">
  		<label for="visinaID">Visina (cm):</label><br>
  		<input type="text" id="fname" name="visina" value="{{podatki['visina']}}"><br>
  		<label for="tezaID">Teža (kg):</label><br>
  		<input type="text" id="lname" name="teza" value="{{podatki['teza']}}"><br><br>
  		<input type="submit" value="Submit">
	</form> 

	{% if podatki ["itm"]%}
	<i>Vai ITM je {{podatki ["itm"]}}</i>
	{% endif %}

</body>
</html>
